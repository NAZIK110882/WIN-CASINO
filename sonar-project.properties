# SonarCloud: https://sonarcloud.io -> Analyze new project -> вкажіть свої organization / projectKey
sonar.organization=YOUR_SONARCLOUD_ORG
sonar.projectKey=YOUR_SONARCLOUD_ORG_WIN-CASINO
