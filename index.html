<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Praktukym Casino - Лобі</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            background-image: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8a2be2;
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e0d4f5;
            text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2;
            margin: 0;
            letter-spacing: 2px;
        }
        .balance {
            font-size: 20px;
            background: rgba(37, 37, 53, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }
        #balanceDisplay { color: #4CAF50; font-weight: bold; }
        
        h2 { text-align: center; margin-top: 50px; font-size: 36px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .games-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .game-card {
            background: #16162a;
            border: 2px solid #333;
            border-radius: 20px;
            width: 280px;
            text-align: center;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .game-card:hover {
            transform: translateY(-10px);
        }

        /* Стилі для конкретних ігор */
        .card-slots:hover { border-color: #8a2be2; box-shadow: 0 15px 30px rgba(138, 43, 226, 0.5); }
        .card-bonanza:hover { border-color: #ff477e; box-shadow: 0 15px 30px rgba(255, 71, 126, 0.5); }
        .card-rocket:hover { border-color: #00bcd4; box-shadow: 0 15px 30px rgba(0, 188, 212, 0.5); }

        .game-icon { 
            font-size: 90px; 
            padding: 40px 0; 
            background: rgba(0,0,0,0.3); 
        }
        .game-info { padding: 25px; }
        .game-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        
        .btn-play {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
        }
        
        /* Кнопки під колір гри */
        .card-slots .btn-play { background: linear-gradient(45deg, #8a2be2, #4a00e0); }
        .card-bonanza .btn-play { background: linear-gradient(45deg, #ff758c, #ff7eb3); }
        .card-rocket .btn-play { background: linear-gradient(45deg, #00bcd4, #2196f3); }
        
        .btn-play:hover { filter: brightness(1.2); letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎰 PRAKTUKYM</div>
        <div class="balance">Мій Баланс: $<span id="balanceDisplay">...</span></div>
    </header>

    <h2>ВИБЕРІТЬ ГРУ</h2>

    <div class="games-container">
        
        <!-- Гра 1: Неонові Слоти -->
        <div class="game-card card-slots">
            <div class="game-icon">🎰</div>
            <div class="game-info">
                <div class="game-title">Neon Slots</div>
                <a href="slots.html" class="btn-play">ГРАТИ</a>
            </div>
        </div>

        <!-- Гра 2: Sugar Bonanza -->
        <div class="game-card card-bonanza">
            <div class="game-icon">🍭</div>
            <div class="game-info">
                <div class="game-title">Sugar Bonanza</div>
                <a href="bonanza.html" class="btn-play">ГРАТИ</a>
            </div>
        </div>

        <!-- Гра 3: Ракетка -->
        <div class="game-card card-rocket">
            <img src="zela.png" alt="Іконка гри" style="width: 200px; height: 200px; object-fit: contain;">
            <div class="game-info">
                <div class="game-title">Space Crash</div>
                <a href="rocket.html" class="btn-play">ГРАТИ</a>
            </div>
        </div>

    </div>

    <script>
        // Завантажуємо баланс з бази даних при відкритті лобі
        fetch('api/user.php')
            .then(res => res.json())
            .then(data => { 
                if(data.success) {
                    document.getElementById('balanceDisplay').innerText = parseFloat(data.balance).toFixed(2);
                } else {
                    document.getElementById('balanceDisplay').innerText = 'Помилка';
                }
            })
            .catch(() => {
                document.getElementById('balanceDisplay').innerText = 'Error'; 
            });
    </script>

</body>
</html>
