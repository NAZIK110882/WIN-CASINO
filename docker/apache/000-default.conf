<VirtualHost *:80>
    DocumentRoot /var/www/html
    Timeout 30
    ServerSignature Off

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Код, залежності та скрипти недоступні по HTTP
    <DirectoryMatch "^/var/www/html/(src|vendor|scripts)">
        Require all denied
    </DirectoryMatch>

    # Apache інколи не передає заголовок Authorization у PHP
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    RewriteEngine On
    # Гарні URL: /api/v1/spin -> /api/v1/spin.php
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.php -f
    RewriteRule ^/api/(v[0-9]+/[A-Za-z_]+)$ /api/$1.php [L]
    # Старі неверсіоновані скрипти (api/spin.php, bootstrap.php) напряму закриті
    RewriteRule ^/api/[A-Za-z_]+\.php$ - [F,L]
</VirtualHost>
