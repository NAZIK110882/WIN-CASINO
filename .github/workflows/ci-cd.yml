name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Continuous Testing: lint + unit + integration + coverage + optional SonarCloud ----------
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: casino_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: casino_db
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # потрібно SonarCloud для blame/new code

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: pcov

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP lint
        run: find api src scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Init DB schema
        run: mysql -h 127.0.0.1 -uroot -proot casino_db < docker/mysql-init.sql

      - name: Unit tests + coverage
        run: |
          mkdir -p coverage
          php vendor/bin/phpunit -c phpunit.xml --coverage-clover coverage/clover.xml

      - name: Integration tests
        run: php vendor/bin/phpunit -c phpunit.integration.xml

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5   # перевірте актуальну версію в Marketplace
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/clover.xml

  # ---------- Continuous Testing: контейнери + smoke + Cypress E2E ----------
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret|' .env
          sed -i 's|^RATE_LIMIT_MAX=.*|RATE_LIMIT_MAX=1000|' .env

      - name: Build & start stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Seed users
        run: docker compose exec -T backend php scripts/seed.php

      - name: API smoke tests
        env:
          CASINO_PASSWORD: change_me_player_pw
          ALLOWED_ORIGIN: http://localhost:8080
        run: scripts/smoke.sh http://localhost:8000/api/v1

      - name: Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          config: baseUrl=http://localhost:8080

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------- Публікація образів у Docker Hub (opt-in) ----------
  publish:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGES == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/win-casino-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/win-casino-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/win-casino-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/win-casino-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Деплой на production-сервер (opt-in) ----------
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/win-casino
            git pull --ff-only
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend php scripts/migrate.php
            docker image prune -f

      - name: Post-deploy smoke test
        env:
          CASINO_PASSWORD: ${{ secrets.SMOKE_PLAYER_PASSWORD }}
          ALLOWED_ORIGIN: https://${{ vars.APP_DOMAIN }}
        run: |
          sleep 20
          scripts/smoke.sh https://${{ vars.API_DOMAIN }}/api/v1
