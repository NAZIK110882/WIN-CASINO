<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sugar Bonanza</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            background: url('bg.jpg') no-repeat center center fixed; 
            background-size: 100% 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .game-container { 
            background: rgba(255, 255, 255, 0.82); 
            backdrop-filter: blur(8px); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.25); 
            text-align: center; 
            border: 5px solid #ff758c; 
            width: 480px; 
        }
        h1 { color: #ff477e; margin-top: 0; text-shadow: 2px 2px 0px #fff; font-size: 28px; }
        .balance-box { font-size: 22px; margin-bottom: 12px; color: #333; font-weight: bold; }
        #balanceDisplay { color: #ff477e; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            background: rgba(255, 227, 232, 0.7); 
            padding: 12px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
        }
        .cell { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 10px; 
            font-size: 52px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 70px; 
            box-shadow: 0 4px 0 #ffb3c6; 
            opacity: 0; 
            transform: translateY(-50px); 
        }
        .drop-anim { animation: dropIn 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
        .winner { animation: pop 0.5s infinite alternate; background: #d4edda; box-shadow: 0 0 15px #28a745; }
        @keyframes pop { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .bet-container { margin-bottom: 12px; }
        .bet-container select { 
            padding: 8px; 
            width: 120px; 
            font-size: 16px; 
            border-radius: 5px; 
            border: 2px solid #ff758c; 
            text-align: center; 
            font-weight: bold; 
            cursor: pointer;
            outline: none;
            background: white;
            color: #333;
        }
        
        button { 
            background: linear-gradient(to bottom, #ff758c, #ff7eb3); 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 5px 0 #d6336c; 
        }
        button:disabled { background: #ccc; box-shadow: 0 5px 0 #999; cursor: not-allowed; }
        .message { margin-top: 10px; font-size: 18px; font-weight: bold; height: 25px; }
        .back-link { display: block; margin-top: 10px; color: #ff477e; text-decoration: none; font-weight: bold; font-size: 15px; }

        /* Модальне вікно для бонуски */
        .bonus-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .bonus-content {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            padding: 35px; border-radius: 25px; text-align: center;
            border: 4px solid #fff; max-width: 400px; width: 85%;
            box-shadow: 0 0 50px rgba(255, 71, 126, 0.9);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .bonus-icon { font-size: 70px; margin-bottom: 10px; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
        .bonus-content h2 { color: white; margin: 0 0 10px 0; font-size: 30px; text-shadow: 2px 2px 0px #d6336c; }
        .bonus-win-text { font-size: 24px; color: #ffeb3b; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 0px #000; }
        .bonus-content button {
            background: #fff; color: #ff477e; border: none; padding: 12px 30px;
            font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .bonus-content button:hover { background: #fff0f3; }
    </style>
</head>
<body>

    <!-- Аудіо елементи з атрибутом preload="auto" для миттєвого завантаження -->
    <audio id="soundBanany" src="banany.mp3" preload="auto"></audio>
    <audio id="soundSlivy" src="slivy.mp3" preload="auto"></audio>
    <audio id="soundArbuzy" src="arbuzy.mp3" preload="auto"></audio>
    <audio id="soundOmagad" src="omagad.mp3" preload="auto"></audio>

    <!-- Попап для бонуски -->
    <div id="bonusModal" class="bonus-modal">
        <div class="bonus-content">
            <div class="bonus-icon">👑🍬</div>
            <h2>БОНУСКА!</h2>
            <div class="bonus-win-text" id="bonusWinText">Виграш: $0.00</div>
            <button onclick="closeBonusModal()">КРУТО!</button>
        </div>
    </div>

    <div class="game-container">
        <h1>🍬 Sugar Bonanza 🍭</h1>
        <div class="balance-box">Баланс: $<span id="balanceDisplay">...</span></div>
        <div class="grid" id="gridDisplay"></div>
        
        <div class="bet-container">
            <label style="color: #444; font-weight: bold; margin-right: 8px;">Сума ставки: $</label>
            <select id="betInput">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="300">300</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        
        <button id="spinBtn">ГРАТИ</button>
        <div class="message" id="messageDisplay"></div>
        <a href="index.html" class="back-link">← У лобі</a>
    </div>

    <script>
        const btn = document.getElementById('spinBtn');
        const gridDisp = document.getElementById('gridDisplay');
        const balanceDisp = document.getElementById('balanceDisplay');
        const msgDisp = document.getElementById('messageDisplay');
        const bonusModal = document.getElementById('bonusModal');
        const bonusWinText = document.getElementById('bonusWinText');

        const spinSounds = [
            document.getElementById('soundBanany'),
            document.getElementById('soundSlivy'),
            document.getElementById('soundArbuzy')
        ];
        const omagadSound = document.getElementById('soundOmagad');

        // Ініціалізація пустої сітки та балансу
        for(let i=0; i<25; i++) { 
            const div = document.createElement('div'); 
            div.className = 'cell'; 
            div.innerText = '❓'; 
            gridDisp.appendChild(div); 
        }
        
        fetch('api/user.php')
            .then(res => res.json())
            .then(data => { 
                if(data.success) balanceDisp.innerText = parseFloat(data.balance).toFixed(2); 
            });

        btn.addEventListener('click', async () => {
            // 🚀 ВІДТВОРЮЄМО ЗВУК МИТТЄВО (найперший рядок при кліку)
            const randomSound = spinSounds[Math.floor(Math.random() * spinSounds.length)];
            randomSound.currentTime = 0;
            randomSound.play().catch(e => console.log("Аудіо заблоковано браузером"));

            const currentBet = parseFloat(document.getElementById('betInput').value);
            
            btn.disabled = true; 
            msgDisp.innerText = ''; 
            gridDisp.innerHTML = '';
            
            try {
                const response = await fetch('api/bonanza.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bet: currentBet })
                });
                const data = await response.json();

                if (data.error) { 
                    msgDisp.innerText = data.error; 
                    msgDisp.style.color = 'red'; 
                    btn.disabled = false; 
                    return; 
                }

                data.grid.forEach((symbol, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell drop-anim'; 
                    cell.innerText = symbol;
                    cell.style.animationDelay = `${Math.floor(index / 5) * 0.08}s`;
                    gridDisp.appendChild(cell);
                });

                setTimeout(() => {
                    balanceDisp.innerText = data.new_balance.toFixed(2);
                    
                    if (data.win > 0) {
                        const isBonus = data.win >= currentBet * 5; 

                        if (isBonus) {
                            omagadSound.currentTime = 0;
                            omagadSound.play().catch(e => console.log("Аудіо заблоковано"));
                            
                            bonusWinText.innerText = `Виграш: $${data.win.toFixed(2)}`;
                            bonusModal.style.display = 'flex';

                            msgDisp.innerText = `🚨 БОНУСКА! СУПЕР ВИГРАШ! 🚨`;
                            msgDisp.style.color = '#ff007f';
                        } else {
                            msgDisp.innerText = `🔥 Виграш: $${data.win.toFixed(2)}! 🔥`; 
                            msgDisp.style.color = '#ff477e';
                        }

                        const cells = document.querySelectorAll('.cell');
                        data.grid.forEach((sym, idx) => { 
                            if (data.winning_symbols.includes(sym)) cells[idx].classList.add('winner'); 
                        });
                    } else { 
                        msgDisp.innerText = 'Спробуй ще!'; 
                        msgDisp.style.color = '#777'; 
                    }
                    btn.disabled = false;
                }, 800);
            } catch (err) { 
                msgDisp.innerText = 'Помилка сервера'; 
                btn.disabled = false; 
            }
        });

        function closeBonusModal() {
            bonusModal.style.display = 'none';
            omagadSound.pause();
        }
    </script>
</body>
</html>
